<title>فيزياء كومنت · الفصل الأول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: cream CoMnt page, navy physics boards with a 60px grid, Dr. Mint on the left edge of each board (never bottom-right). */
:root{
  /* Physics kit */
  --navy:#013869; --blue:#054D8D; --sky:#C9E6FF; --yellow:#EFD349; --red:#D82B35; --green:#2C9B5E;
  --white:#FFFFFF; --gray:#EAECED; --red-tint:#FDECEC; --red-border:#F3B9BD; --green-tint:#E7F5ED; --green-border:#A9DBBF;
  --grid-navy:rgba(201,230,255,.07); --grid-white:rgba(5,77,141,.08);
  /* Pen colour code (navy boards) */
  --pen-formula:#EFD349; --pen-given:#C9E6FF; --pen-warn:#FF7078; --pen-check:#58D696; --pen-trap:#FF9F1C;
  /* CoMnt brand */
  --cream:#FFF6E8; --leaf:#7BB526; --leaf-dark:#347403; --leaf-cream:#F0F7E1; --tea:#390701; --salmon:#EF8575;
  /* Type */
  --f-brand:"Baloo Bhaijaan 2","IBM Plex Sans Arabic","DM Sans",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","DM Sans",system-ui,sans-serif;
  --f-lat:"DM Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r-sm:6px; --r-md:22px; --r-lg:28px; --pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--cream);color:var(--tea);font-family:var(--f-ar);font-size:17px;line-height:1.75;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.m{font-family:var(--f-lat);direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
sup,sub{font-size:.7em;line-height:0}
.stack > .btn,.prob > .btn{align-self:flex-start}
h1,h2,h3{font-family:var(--f-brand);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.board.light :focus-visible,.board.sky :focus-visible,.qcard :focus-visible{outline-color:var(--navy)}

/* ---------- Top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--white)}
.topbar .row1{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.topbar .logo{height:38px;width:auto;display:block}
.topbar .course{font:600 13px/1.3 var(--f-ar);color:var(--sky)}
.tabs{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.tab{border:2px solid rgba(201,230,255,.35);background:transparent;color:var(--white);border-radius:var(--pill);padding:4px 14px;font:700 14px/1.4 var(--f-ar);cursor:pointer}
.tab[aria-selected="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.tab:disabled{opacity:.55;cursor:not-allowed}
.tab small{font-weight:500;opacity:.8}
@media (max-width:1320px){.topbar .course{display:none}}
.fsbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--yellow);background:transparent;color:var(--yellow);border-radius:var(--pill);padding:4px 12px;font:700 13px/1.4 var(--f-ar);cursor:pointer}
.fsbtn:hover{background:var(--yellow);color:var(--navy)}
.fsmsg{position:fixed;inset:auto 16px calc(16px + env(safe-area-inset-bottom,0px)) 16px;max-width:520px;margin:auto;background:var(--white);color:var(--navy);border:3px solid var(--navy);border-radius:var(--r-md);padding:10px 14px;z-index:50;font-weight:600;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:thin}
.chips a{flex:none;color:var(--sky);text-decoration:none;font:600 13px/1 var(--f-ar);padding:7px 12px;border-radius:var(--pill);background:rgba(201,230,255,.08)}
.chips a:hover,.chips a.on{background:var(--sky);color:var(--navy)}
 @media (max-width:640px){
  .topbar .course{display:none}
  .topbar .row1{gap:10px;padding-block:8px}
  .topbar .logo{height:36px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin-inline-start:0;width:100%;scrollbar-width:none}
  .tab{flex:none;font-size:13px;padding:3px 12px}
  .tab small{display:none}
  .fsbtn span{display:none}
}
.progress{height:4px;background:rgba(201,230,255,.15)}
.progress i{display:block;height:100%;width:0;background:var(--yellow)}

/* ---------- Boards ---------- */
main{display:flex;flex-direction:column;gap:28px;padding-block:28px 64px}
.board{position:relative;border-radius:var(--r-lg);padding:clamp(20px,3.6vw,40px);overflow:hidden;background-color:var(--navy);color:var(--white);
  background-image:linear-gradient(var(--grid-navy) 1px,transparent 1px),linear-gradient(90deg,var(--grid-navy) 1px,transparent 1px);background-size:60px 60px}
.board.light{background-color:var(--white);color:var(--navy);background-image:linear-gradient(var(--grid-white) 1px,transparent 1px),linear-gradient(90deg,var(--grid-white) 1px,transparent 1px)}
.board.sky{background-color:var(--sky);color:var(--navy);background-image:none}
.board.cream{background-color:var(--leaf-cream);color:var(--tea);background-image:none;border:3px solid var(--tea)}
.board.khamseena{background:var(--tea);color:var(--cream);background-image:none}
.with-mint{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:24px;align-items:start}
.mint{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:140px}
.mint img{height:250px;width:auto}
.bubble{background:var(--white);color:var(--navy);border-radius:var(--r-md);padding:10px 14px;font:600 14px/1.55 var(--f-ar);position:relative;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--white)}
.board.light .bubble,.board.sky .bubble{background:var(--navy);color:var(--white)}
.board.light .bubble::after,.board.sky .bubble::after{border-top-color:var(--navy)}
@media (max-width:760px){
  .with-mint{grid-template-columns:1fr}
  .mint{position:static;flex-direction:row-reverse;justify-content:flex-end;order:-1}
  .mint img{height:120px}
  .bubble::after{display:none}
}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 13px/1 var(--f-ar);letter-spacing:.02em}
.seg{display:inline-flex;align-items:center;gap:8px;border-radius:var(--pill);padding:6px 14px;font:800 14px/1.2 var(--f-ar);background:var(--yellow);color:var(--navy);width:max-content;max-width:100%}
.seg .en{font:800 11px/1 var(--f-lat);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.seg.red{background:var(--red);color:var(--white)}
.seg.green{background:var(--green);color:var(--white)}
.seg.sky{background:var(--sky);color:var(--navy)}
.seg.navy{background:var(--navy);color:var(--white)}
.seg.leaf{background:var(--leaf);color:var(--tea)}
.seg.salmon{background:var(--salmon);color:var(--tea)}
.seg.tea{background:var(--cream);color:var(--tea)}
.h2{font-size:clamp(26px,3.4vw,38px);font-weight:800}
.h2::after{content:"";display:block;width:180px;max-width:50%;height:6px;background:var(--yellow);margin-top:8px}
.board.sky .h2::after,.board.light .h2::after{background:var(--navy)}
.h3{font-size:clamp(20px,2.4vw,24px);font-weight:700}
.lead{font-size:18px;max-width:68ch}
.muted{opacity:.82}
.on-navy-given{color:var(--pen-given)}
.ylw{color:var(--pen-formula)}
.mintc{color:var(--pen-check)}
.coral{color:var(--pen-warn)}
.trapc{color:var(--pen-trap)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* Formula box: yellow pen on navy, yellow fill on light */
.fbox{border:2px solid var(--pen-formula);border-radius:var(--r-sm);padding:12px 16px;color:var(--pen-formula);display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:center;font-size:19px}
.board.light .fbox,.board.sky .fbox,.qcard .fbox{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.note{border-inline-start:4px solid var(--pen-given);padding:6px 14px;background:rgba(201,230,255,.07);border-radius:0 var(--r-sm) var(--r-sm) 0}
.board.light .note,.board.sky .note{border-color:var(--blue);background:rgba(5,77,141,.06)}
.term{border:2px dashed var(--pen-given);border-radius:var(--r-md);padding:12px 16px}
.term b{color:var(--pen-given)}
ul.dots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.dots li{display:flex;gap:12px;align-items:baseline}
ul.dots li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--yellow);transform:translateY(1px)}
.board.sky ul.dots li::before,.board.light ul.dots li::before{background:var(--navy)}
ol.num{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}

/* Question of the lesson */
.qbox{background:var(--yellow);color:var(--navy);border-radius:var(--r-md);padding:16px 20px;font-weight:600}
.qbox .h3{margin-bottom:6px}

/* Controls */
.btn{appearance:none;border:0;background:var(--yellow);color:var(--navy);border-radius:var(--pill);padding:9px 20px;font:700 15px/1.3 var(--f-ar);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.navy{background:var(--navy);color:var(--white)}
.btn.small{padding:6px 14px;font-size:13px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl label{display:flex;justify-content:space-between;gap:8px;font:600 14px/1.4 var(--f-ar)}
.ctrl output{font:700 15px var(--f-lat);direction:ltr;color:var(--pen-formula)}
.board.light .ctrl output,.board.sky .ctrl output{color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--yellow);height:28px}
.board.light input[type=range],.board.sky input[type=range]{accent-color:var(--navy)}
.sim{background:rgba(0,20,45,.35);border:2px solid rgba(201,230,255,.18);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.board.light .sim,.board.sky .sim{background:var(--white);border-color:rgba(1,56,105,.15)}
canvas{display:block;width:100%;border-radius:14px;touch-action:none}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.readout div{background:rgba(201,230,255,.08);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.readout span{font:500 12px/1.3 var(--f-ar);color:var(--pen-given)}
.readout b{font:700 18px/1.2 var(--f-lat);direction:ltr;text-align:right;color:var(--pen-formula)}
.board.light .readout div,.board.sky .readout div{background:var(--sky)}
.board.light .readout span,.board.sky .readout span{color:var(--blue)}
.board.light .readout b,.board.sky .readout b{color:var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13px/1.4 var(--f-ar)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}

/* Polls */
.poll{display:flex;flex-direction:column;gap:10px;background:rgba(201,230,255,.07);border-radius:var(--r-md);padding:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid rgba(201,230,255,.4);background:transparent;color:var(--white);border-radius:var(--pill);padding:7px 16px;cursor:pointer;font:600 15px/1.3 var(--f-ar)}
.opt[aria-pressed="true"]{background:var(--sky);color:var(--navy);border-color:var(--sky)}
.reveal{border-inline-start:4px solid var(--pen-check);padding:8px 14px;background:rgba(88,214,150,.08);border-radius:0 var(--r-sm) var(--r-sm) 0}

/* Table */
.tablewrap{overflow-x:auto}
table{color:inherit;font:inherit;border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{border:1px solid rgba(201,230,255,.25);padding:8px 10px;text-align:center}
th{background:rgba(201,230,255,.12);font-weight:600;color:var(--pen-given)}
td.m{display:table-cell}

/* Worked example */
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:var(--white);color:var(--navy);border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step:nth-child(2),.step:nth-child(4){background:var(--blue);color:var(--white)}
.step .lbl{font:800 14px/1.3 var(--f-ar);display:flex;gap:8px;align-items:center}
.step .lbl i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--navy);font:800 15px var(--f-lat)}
.step.hidden-step{display:none}
.answer{border:2px solid var(--yellow);border-radius:var(--r-sm);padding:6px 12px;color:var(--yellow);width:max-content;max-width:100%}
.step:nth-child(1) .answer,.step:nth-child(3) .answer{background:var(--yellow);color:var(--navy)}

/* Try this (yellow panel) */
.try{background:var(--yellow);color:var(--navy);border-radius:var(--r-lg);padding:clamp(20px,3.6vw,40px)}
.try .h2::after{background:var(--navy)}
.prob{background:var(--white);border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ansrow input[type=text]{width:120px;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;font:700 16px var(--f-lat);direction:ltr;text-align:left;color:var(--navy);background:var(--white)}
.ansrow select{border:2px solid var(--navy);border-radius:10px;padding:6px 10px;color:var(--navy);background:var(--white)}
.unit{font:600 15px var(--f-lat);direction:ltr}
.fb{font-weight:600;font-size:15px}
.fb.ok{color:var(--green)}
.fb.no{color:var(--red)}
.sol{border-inline-start:4px solid var(--green);background:var(--green-tint);padding:8px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--navy)}

/* Exam trap */
.trap{background:var(--white);color:var(--navy);border-radius:var(--r-lg);overflow:hidden}
.trap .hd{background:var(--red);color:var(--white);padding:18px clamp(20px,3.6vw,40px);display:flex;align-items:center;gap:14px}
.trap .hd .h2::after{background:var(--white)}
.trap .bd{padding:clamp(20px,3.6vw,40px)}
.tri{width:44px;height:40px;flex:none}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.bad,.good{border-radius:var(--r-md);padding:12px 16px;border:2px solid}
.bad{background:var(--red-tint);border-color:var(--red-border)}
.good{background:var(--green-tint);border-color:var(--green-border)}
.bad b{color:var(--red)} .good b{color:var(--green)}
.trapitem{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-bottom:3px solid var(--pen-trap)}
.trapitem:last-child{border-bottom:0}

/* Summary columns */
.sumcol{border-top:6px solid var(--yellow);background:rgba(201,230,255,.07);border-radius:0 0 var(--r-md) var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sumcol:nth-child(2){border-color:var(--pen-given)}
.sumcol:nth-child(3){border-color:var(--pen-check)}

/* Challenge */
.chal{background:var(--green);color:var(--white);border-radius:var(--r-lg);padding:clamp(20px,3.6vw,40px)}
.chal .h2::after{background:var(--white)}
.chal .prob{color:var(--navy)}

/* Khamseena + comment */
.kh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.glass{width:54px;height:76px}
.comment{background:var(--leaf-cream);color:var(--tea);border:3px solid var(--tea);border-radius:40px 40px 40px 8px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.comment textarea{border:2px solid var(--tea);border-radius:16px;padding:10px 14px;min-height:80px;background:var(--white);color:var(--tea);resize:vertical}

/* Quiz */
.quizhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.score{display:flex;align-items:center;gap:12px;background:var(--white);color:var(--navy);border-radius:var(--pill);padding:6px 16px 6px 6px;font:700 16px var(--f-ar)}
.score img{width:44px;height:44px}
.score .m{font-size:18px}
.qlist{display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--white);color:var(--navy);border-radius:var(--r-md);padding:18px 20px;display:flex;flex-direction:column;gap:12px;border:3px solid transparent}
.qcard.ok{border-color:var(--green)}
.qcard.no{border-color:var(--red)}
.qtop{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--yellow);font:800 15px var(--f-lat)}
.qtype{font:700 11px/1 var(--f-ar);background:var(--sky);color:var(--navy);padding:4px 8px;border-radius:var(--pill);width:max-content}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
.choice{display:flex;gap:10px;align-items:center;border:2px solid var(--gray);border-radius:14px;padding:9px 12px;cursor:pointer;background:var(--white)}
.choice:hover{border-color:var(--sky)}
.choice input{accent-color:var(--navy);width:18px;height:18px;flex:none}
.choice.right{background:var(--green-tint);border-color:var(--green)}
.choice.wrong{background:var(--red-tint);border-color:var(--red)}
.ex{background:var(--sky);border-radius:14px;padding:10px 14px;font-size:15.5px}
.ex b.okh{color:var(--green)} .ex b.noh{color:var(--red)}
.pad{display:flex;flex-direction:column;gap:8px}
.pad canvas{height:220px;border:2px solid var(--sky);background-color:var(--white);
  background-image:linear-gradient(var(--grid-white) 1px,transparent 1px),linear-gradient(90deg,var(--grid-white) 1px,transparent 1px);background-size:30px 30px}
.pad textarea{border:2px solid var(--sky);border-radius:12px;padding:8px 12px;min-height:60px;color:var(--navy);resize:vertical}
.padtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 0 2px var(--gray);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--navy)}
.endcard{display:none;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--white);color:var(--navy);border-radius:var(--r-md);padding:18px}
.endcard.show{display:grid}
.endcard img{height:160px}
footer{padding-block:24px 40px;color:var(--tea);font-size:14px;text-align:center}
.coming{display:grid;place-items:center;text-align:center;gap:12px;min-height:300px}
.valbox{display:inline-flex;align-items:center;gap:6px;flex:none}
.numin{width:76px;direction:ltr;text-align:center;font:700 15px var(--f-lat);color:var(--pen-formula);background:rgba(0,20,45,.45);border:2px solid rgba(239,211,73,.55);border-radius:8px;padding:2px 6px}
.numin:focus{outline:none;border-color:var(--yellow);background:rgba(0,20,45,.7)}
.numin.bad{border-color:var(--pen-warn)}
.board.light .numin,.board.sky .numin{color:var(--navy);background:var(--white);border-color:var(--navy)}
.ctrl label{align-items:center;justify-content:flex-start;gap:4px;flex-wrap:wrap}
.valbox{margin-inline-start:auto}
.plain{background:rgba(88,214,150,.08);border:2px dashed var(--pen-check);border-radius:var(--r-md);padding:12px 16px}
.plain b.t{color:var(--pen-check);display:block;margin-bottom:2px}
.board.sky .plain,.board.light .plain{background:var(--white);border-color:var(--green)}
.board.sky .plain b.t,.board.light .plain b.t{color:var(--green)}
.laws{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.law{background:var(--sky);color:var(--navy);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.law .eq{font:700 19px/1.5 var(--f-lat);direction:ltr;text-align:center;background:var(--yellow);border-radius:var(--r-sm);padding:6px 8px}
.law small{font-size:14px;line-height:1.6}
.vec{position:relative;display:inline-block;padding-top:.18em}
.vec::after{content:"";position:absolute;left:0;right:1px;top:.05em;height:2px;background:currentColor;border-radius:1px}
.vec::before{content:"";position:absolute;right:-2px;top:calc(.05em - 3px);border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.choice b.ltr{font:700 15px var(--f-ar);min-width:1.4em}

/* ===== Games + Basics ===== */
.en-term{display:inline-block;direction:ltr;unicode-bidi:isolate;font:600 12px/1.2 var(--f-lat);color:var(--navy);background:var(--sky);border-radius:var(--pill);padding:2px 8px;margin-inline:2px;vertical-align:.12em;white-space:nowrap}
.board.light .en-term,.board.sky .en-term,.law .en-term{background:var(--navy);color:var(--white)}
.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.chiplist a{color:var(--navy);background:var(--sky);text-decoration:none;font:700 14px/1 var(--f-ar);padding:9px 14px;border-radius:var(--pill)}
.chiplist a:hover{background:var(--yellow)}
.gcard{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--white);border:2px solid rgba(201,230,255,.35);border-radius:var(--r-md);padding:14px 16px;background:rgba(201,230,255,.06)}
.gcard b{font:800 20px/1.3 var(--f-ar);color:var(--yellow)}
.gcard span{color:var(--pen-given);font-size:14px}
.gcard:hover{border-color:var(--yellow)}
.convrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.numin.big{width:110px;font-size:18px;padding:6px 8px}
.convrow select{font:700 16px var(--f-lat);direction:ltr;padding:6px 10px;border-radius:8px;border:2px solid rgba(239,211,73,.55);background:rgba(0,20,45,.45);color:var(--pen-formula)}
.convrow select option{color:#013869;background:#fff}
.board.light th{background:var(--sky);color:var(--navy)}
.board.light th,.board.light td{border-color:rgba(1,56,105,.2)}
.glsearch{width:100%;max-width:460px;font:600 17px var(--f-ar);padding:10px 16px;border-radius:var(--pill);border:2px solid var(--navy);color:var(--navy);background:var(--white)}
.gltable td:nth-child(2){direction:ltr;font-family:var(--f-lat);font-weight:600}
.gltable td:nth-child(3){text-align:start}
.blitz{background:var(--white);color:var(--navy);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:14px}
.blitzhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:700}
.blitzhead b{font-size:30px;color:var(--navy)}
.blitzhead #gbTime{color:var(--red)}
.blitzhead .muted{margin-inline-start:auto}
.blitzq{font:700 20px/1.6 var(--f-ar);min-height:2.4em}
.blitz .choice{justify-content:center;font:700 17px var(--f-lat);direction:ltr;color:var(--navy)}
.blitz .choice:disabled{cursor:default}
@media (display-mode: standalone){.fsbtn{display:none}}
